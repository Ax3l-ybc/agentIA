# =====================================================================
#  Réglages techniques de « Mon Assistant »
# =====================================================================
#  Vos assistants (leurs consignes, leur voix, leurs documents) ne se règlent pas ici :
#  modifiez-les depuis la page web, ou avec le Bloc-notes dans le dossier « assistants ».
#
#  Ouvrez ce fichier avec le Bloc-notes, modifiez les valeurs, enregistrez, puis relancez
#  lancer.bat. Gardez les apostrophes simples ' ' autour des textes.
# =====================================================================

# Jeton Hugging Face : nécessaire une seule fois, pour télécharger la voix (voir le README).
# Sans jeton, l'assistant marche quand même, mais seulement à l'écrit.
jeton_huggingface: ''

# --- Le cerveau : Gemma 4 E2B de Google, dans llama.cpp -----------------
cerveau:
  # Version du modèle (dans %USERPROFILE%\MonAssistant\modeles).
  #   'gemma-4-E2B-it-Q4_K_M.gguf' (conseillé) ; 'gemma-4-E2B-it-Q3_K_M.gguf' plus rapide, un peu moins fin.
  modele: 'gemma-4-E2B-it-Q4_K_M.gguf'
  # Mémoire de travail (en « jetons ») : 16384 permet de longues conversations et des documents.
  taille_contexte: 16384
  # 0 = tout sur le processeur (le plus sûr). Avec une carte graphique bien reconnue,
  # 99 met tout le modèle dessus (bien plus rapide).
  couches_gpu: 0
  # Créativité des réponses : 0.3 = sobre et précis, 0.8 = plus inventif.
  temperature: 0.6

# --- La voix : Phonon de Gradium ----------------------------------------
voix:
  modele: 'hf://gradium/phonon-40m-fr'
  # Vitesse : 0 = normal, -0.2 = plus rapide, 0.2 = plus lent.
  vitesse: 0.0
  # (Le nom de la voix se choisit pour chaque assistant, dans la page.)

# --- La conversation à la voix ------------------------------------------
conversation:
  # Secondes de silence qui marquent la fin de votre phrase. Augmentez (1.5, 1.8…) si
  # l'assistant vous coupe pendant que vous réfléchissez.
  pause_fin_de_phrase_s: 1.2
  # Envoi anticipé : l'assistant prépare sa réponse dès ce court silence, mais ne parle
  # qu'une fois la pause ci-dessus atteinte ; si vous reprenez, il l'abandonne. 0 = désactivé.
  anticipation_s: 0.4

# Port de la page web (http://127.0.0.1:8000). Un autre est choisi s'il est déjà pris.
port: 8000
