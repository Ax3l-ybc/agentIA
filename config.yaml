# =====================================================================
#  Réglages de l'agent « Directeur de mémoire »
# =====================================================================
#  Ouvrez ce fichier avec le Bloc-notes, modifiez les valeurs, enregistrez.
#  IMPORTANT : gardez les apostrophes simples ' ' autour des chemins.
# =====================================================================

# --- 1. Vos dossiers --------------------------------------------------

# Dossier « mémoire » de votre coffre Obsidian (vos notes .md).
# L'agent le lit directement, sans faire de copie, et ne le modifie JAMAIS.
dossier_notes: 'C:\Users\VotreNom\Documents\Obsidian\MonCoffre\Mémoire'

# Dossier où l'agent écrit les fiches récapitulatives de séance.
# Il est créé s'il n'existe pas. Il doit se trouver EN DEHORS du dossier des notes.
dossier_recaps: 'C:\Users\VotreNom\Documents\Obsidian\MonCoffre\Recaps'

# Fichier qui décrit le comportement de l'agent (son « mode de conduite »).
# Modifiez-le avec le Bloc-notes : il est relu au début de chaque séance.
mode_de_conduite: 'mode_de_conduite.md'

# Sujet de votre mémoire, en une phrase (facultatif mais utile).
# Une apostrophe dans le texte (« d'appui ») ne pose pas de problème.
sujet_memoire: ''

# --- 2. Le « cerveau » (Ollama) ---------------------------------------

ollama:
  adresse: 'http://127.0.0.1:11434'
  # Modèle téléchargé automatiquement au premier lancement.
  #   mistral-small3.2 -> Mistral Small 3.2 (24B, environ 15 Go). Très bon en français.
  #                       Demande au moins 24 Go de mémoire vive (32 conseillés),
  #                       et répond lentement sur un simple processeur.
  #   qwen2.5:7b       -> plus léger (environ 5 Go), plus rapide, un peu moins fin.
  modele: 'mistral-small3.2'
  # Mémoire de travail du modèle (en « tokens »). 16384 convient très bien.
  taille_contexte: 16384

# --- 3. La voix (Phonon de Gradium) ----------------------------------

voix:
  modele: 'hf://gradium/phonon-40m-fr'
  # Nom de la voix. Laissez vide pour la voix par défaut.
  # Voix françaises : Hélène, Tiphaine, Orianne, Ninon, Noémie, Coralie, Maëlys,
  # Solène, Lilou (féminines) ; Arnaud, Lucien, Augustin, Jules, Baptiste, Marius
  # (masculines). Exemple : nom: 'Hélène'
  nom: ''
  # Vitesse : 0 = normal, -0.2 = plus rapide, 0.2 = plus lent.
  vitesse: 0.0

# --- 4. L'écoute (Kyutai STT ou Whisper) ------------------------------

transcription:
  # Moteur d'écoute :
  #   'auto'    -> Kyutai si l'ordinateur a une carte NVIDIA, sinon Whisper
  #   'kyutai'  -> transcription en continu, très réactive (carte NVIDIA indispensable)
  #   'whisper' -> fonctionne sur tous les PC ; comprend chaque phrase après une courte pause
  moteur: 'auto'
  modele: 'kyutai/stt-1b-en_fr-candle'
  # Taille de Whisper : 'small' (rapide, conseillé) ou 'large-v3-turbo' (plus précis, PC puissant)
  modele_whisper: 'small'
  # Avec Whisper : secondes de silence qui marquent la fin de votre phrase.
  # Augmentez (1.2, 1.5…) si l'agent vous coupe pendant que vous réfléchissez.
  pause_fin_de_phrase_s: 0.8

# --- 5. Divers --------------------------------------------------------

# Jeton Hugging Face (obligatoire au premier lancement pour télécharger la voix).
# Voir le README, étape 3.
jeton_huggingface: ''

# Processeur utilisé pour l'écoute et la voix : 'auto', 'cuda' (carte NVIDIA) ou 'cpu'.
materiel: 'auto'

conversation:
  # Secondes de silence avant que l'agent ne vous relance.
  silence_avant_relance_s: 15
  # Si toutes vos notes font moins que ce nombre de caractères,
  # l'agent les connaît en entier dès le début. Sinon, il les consulte au besoin.
  notes_en_entier_si_moins_de: 20000

# Port de la page web (http://localhost:8000).
port: 8000
