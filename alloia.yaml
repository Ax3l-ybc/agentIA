# =====================================================================
#  Réglages d'AlloIA (le téléphone de documentation du FabLab)
#  Version « rapide » : Gemma 4 écoute directement la voix, dans llama.cpp.
# =====================================================================
#  Modifiez avec un éditeur de texte (par exemple : gedit alloia.yaml).
#  Gardez les apostrophes simples ' ' autour des textes.
# =====================================================================

# Dossier où sont écrites les documentations (un fichier .md par appel).
dossier_docs: '~/AlloIA/docs'

# Comportement de l'agent et modèle de la documentation (fichiers modifiables).
mode_de_conduite: 'alloia_conduite.md'
modele_doc: 'alloia_modele_doc.md'

# --- Le cerveau qui écoute -------------------------------------------
cerveau:
  # 'llamacpp' : Gemma 4 E2B dans llama.cpp, sur la puce graphique (rapide, conseillé)
  # 'ollama'   : le modèle de la partie « ollama » ci-dessous (plus lourd en mémoire)
  moteur: 'llamacpp'
  llamacpp:
    # Fichiers installés par ./jetson/installer.sh (dans ~/AlloIA).
    serveur: '~/AlloIA/llama.cpp/build/bin/llama-server'
    # Q3_K_M : rapide et léger (2,4 Go). Pour un peu plus de finesse (et de mémoire) :
    # '~/AlloIA/modeles/gemma-4-E2B-it-Q4_K_M.gguf' (à télécharger, voir le README).
    modele: '~/AlloIA/modeles/gemma-4-E2B-it-Q3_K_M.gguf'
    mmproj: '~/AlloIA/modeles/mmproj-F16.gguf'
    # Mémoire de travail : 4096 suffit pour un appel ; plus = plus de mémoire utilisée.
    taille_contexte: 4096
    port: 8090

# --- Ollama (seulement si cerveau > moteur: 'ollama') ----------------
ollama:
  adresse: 'http://127.0.0.1:11434'
  # Modèle qui comprend directement l'audio :
  #   gemma4:e2b -> Gemma 4 E2B de Google (environ 4,6 Go), conseillé
  #   lfm3-omni  -> LFM3-Omni de Liquid AI (environ 2 Go), plus léger
  modele: 'gemma4:e2b'
  taille_contexte: 8192
  temperature: 0.4
  # Mode « réflexion » de Gemma 4 : plus lent, à laisser sur false au téléphone.
  reflexion: false

# --- L'écoute --------------------------------------------------------
ecoute:
  # Secondes de silence qui marquent la fin d'une phrase. Plus court = réponses plus
  # rapides, mais AlloIA risque de couper la parole à quelqu'un qui réfléchit.
  pause_fin_de_phrase_s: 1.3

# --- La voix ---------------------------------------------------------
voix:
  # 'phonon' : voix Phonon de Gradium (rapide, sur le processeur, jeton Hugging Face requis)
  # 'ollama' : voix d'un modèle Ollama qui sait parler (lfm3-omni) ; demande qu'Ollama
  #            tourne, ce qui prend de la mémoire : déconseillé sur la Jetson Orin Nano.
  moteur: 'phonon'
  # Pour Phonon :
  modele: 'hf://gradium/phonon-40m-fr'
  # Voix françaises : Hélène, Tiphaine, Orianne, Ninon, Noémie, Coralie, Maëlys, Solène,
  # Lilou, Arnaud, Lucien, Augustin, Jules, Baptiste, Marius. Vide = voix par défaut.
  nom: 'Jules'
  vitesse: 0.0
  # Pour une voix Ollama (moteur: 'ollama') :
  modele_ollama: 'lfm3-omni'
  voix_ollama: 'male-french'

# Jeton Hugging Face (obligatoire au premier lancement pour télécharger Phonon).
jeton_huggingface: ''

# --- Le combiné (carte son USB) --------------------------------------
audio:
  # Nom (ou morceau du nom) de la carte son. Vide = carte par défaut.
  # La liste s'obtient avec : ./jetson/lancer.sh --lister-audio
  entree: ''
  sortie: ''
  # Coupe le micro pendant que l'agent parle, pour qu'il ne s'entende pas lui-même.
  couper_micro_quand_agent_parle: true
  # Volume de la voix (1.0 = normal).
  volume: 1.0

# --- Déroulement d'un appel ------------------------------------------
appel:
  # L'appel commence quand quelqu'un parle dans le micro pendant au moins ce temps.
  parole_pour_decrocher_s: 0.6
  # Secondes de silence avant que l'agent relance la personne.
  relance_apres_s: 12
  # L'appel se termine tout seul après ce silence (personne ne répond plus).
  fin_apres_silence_s: 60
  # Durée maximale d'un appel, en minutes.
  duree_max_min: 25
